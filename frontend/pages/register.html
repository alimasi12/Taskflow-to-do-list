<!--Page d'inscription-->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription — TASKFLOW</title>
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <main class="auth-wrapper">
      <section class="auth-card" aria-labelledby="register-title">
        <header class="auth-header">
          <p class="auth-brand">TASKFLOW</p>
          <h1 id="register-title">Créer un compte</h1>
          <p>Organisez vos projets et suivez vos tâches au quotidien.</p>
        </header>

        <form id="register-form" action="#" method="post">
          <div class="form-group">
            <label for="name">Nom complet</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Ex. : Alimasi Bondo"
              required
              autocomplete="name"
            />
          </div>

          <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="vous@exemple.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="password">Mot de passe</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Minimum 8 caractères"
              minlength="8"
              required
              autocomplete="new-password"
            />
          </div>

          <button type="submit" class="btn btn-primary btn-full">
            S'inscrire
          </button>
        </form>

        <footer class="auth-footer">
          <p>Déjà un compte ? <a href="./login.html">Se connecter</a></p>
        </footer>
      </section>
    </main>
  </body>
</html>
